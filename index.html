<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page.doc_title">进销存管理系统 v1.0.0</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2e7d32;--primary-hover:#1b5e20;--primary-light:#e8f5e9;--success:#34c759;--warning:#ff9500;--danger:#ff3b30;--bg:#f5f6f8;--sidebar-bg:#1a2f1a;--sidebar-text:#b8c5b9;--sidebar-active:#2e7d32;--card-bg:#fff;--border:#e5e6eb;--text:#1f2329;--text-secondary:#646a73;--text-muted:#999;--radius:8px;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-hover:0 4px 12px rgba(0,0,0,.12)}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.app-shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:width .18s ease}
.sidebar.collapsed{width:54px}
.sidebar-header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.sidebar-brand{font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;text-decoration:none;overflow:hidden;white-space:nowrap;flex:1}
.sidebar-brand .brand-icon{width:26px;height:26px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.sidebar-collapse-btn{background:rgba(255,255,255,.08);border:none;color:var(--sidebar-text);width:24px;height:24px;border-radius:5px;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .2s}
.sidebar-collapse-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.sidebar-nav{flex:1;padding:6px 6px;overflow-y:auto}
.sidebar-group-title{font-size:10px;text-transform:uppercase;color:rgba(255,255,255,.4);padding:8px 10px 4px;letter-spacing:.5px;white-space:nowrap;overflow:hidden}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .2s;font-size:13px;color:var(--sidebar-text);margin-bottom:1px;white-space:nowrap;overflow:hidden}
.sidebar-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar-item.active{background:var(--sidebar-active);color:#fff}
.sidebar-item .icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:6px;border-top:1px solid rgba(255,255,255,.1);font-size:10px;color:rgba(255,255,255,.4);text-align:center;flex-shrink:0;white-space:nowrap;overflow:hidden}
/* 折叠态：仅显示图标，点击折叠按钮可展开 */
.sidebar.collapsed .sidebar-header{justify-content:center;padding:0}
.sidebar.collapsed .sidebar-brand{display:none}
.sidebar.collapsed .sidebar-group-title{display:none}
.sidebar.collapsed .sidebar-item{justify-content:center;padding:9px 0;gap:0}
.sidebar.collapsed .sidebar-item span:not(.icon){display:none}
.sidebar.collapsed .sidebar-footer{display:none}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:48px;background:var(--card-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 0 0 0;flex-shrink:0;box-shadow:var(--shadow)}
.topnav{display:flex;align-items:center;height:100%;flex:1;overflow-x:auto}
.topnav-item{padding:0 18px;height:48px;display:flex;align-items:center;cursor:pointer;font-size:14px;color:var(--text-secondary);border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;text-decoration:none}
.topnav-item:hover{color:var(--primary);background:var(--primary-light)}
.topnav-item.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:16px;padding-right:20px;flex-shrink:0}
.user-menu{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 12px;border-radius:6px;transition:background .2s}
.user-menu:hover{background:var(--bg)}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.user-info{display:flex;flex-direction:column;line-height:1.2}
.user-name{font-size:13px;font-weight:600}
.user-role{font-size:11px;color:var(--text-muted)}
.logout-btn{color:var(--text-muted);font-size:13px;cursor:pointer;border:none;background:none;padding:6px 10px;border-radius:6px}
.logout-btn:hover{background:var(--bg);color:var(--danger)}
.content{flex:1;overflow-y:auto;padding:12px 14px}
.content-inner{max-width:none;margin:0}
.flash{display:none;padding:12px 18px;border-radius:var(--radius);margin-bottom:16px;font-size:14px}
.flash.show{display:block}
.flash-success{background:#e8f8ef;color:#1a7a3a;border:1px solid #b7ebc3}
.flash-danger{background:#fde8e8;color:#c53030;border:1px solid #fbb}
.flash-warning{background:#fff8e6;color:#9a6d0a;border:1px solid #ffe3a3}
.flash-info{background:#e6f0ff;color:#2b5fbf;border:1px solid #b3d4ff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .2s;white-space:nowrap;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--card-bg);color:var(--text-secondary);border-color:var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);transition:all .2s;border:2px solid transparent}
.stat-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.stat-card.warning{border-color:var(--warning)}
.stat-card.danger{border-color:var(--danger)}
.stat-card.success{border-color:var(--success)}
.stat-number{font-size:22px;font-weight:700;color:var(--primary)}
.stat-card.danger .stat-number{color:var(--danger)}
.stat-card.warning .stat-number{color:var(--warning)}
.stat-label{font-size:12px;color:var(--text-secondary);margin-top:4px}
.table-container{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;margin-bottom:12px}
.data-table{width:100%;min-width:max-content;border-collapse:collapse;font-size:12px}
.data-table th,.data-table td{box-sizing:border-box}
.data-table .col-sticky{position:sticky;left:0;background:var(--card-bg,#fff);z-index:1}
.data-table thead .col-sticky{background:#fafbfc;z-index:2}
.data-table thead{background:#fafbfc;border-bottom:2px solid var(--border)}
.data-table th{padding:6px 9px;text-align:left;font-weight:600;color:var(--text-secondary);font-size:11px;white-space:nowrap;line-height:1.3}
.data-table td{padding:6px 9px;border-bottom:1px solid var(--border);line-height:1.35}
.data-table tbody tr:hover{background:#f8f9ff}
.data-table tbody tr:last-child td{border-bottom:none}
.cell-id{color:var(--text-muted);font-family:monospace;font-size:12px;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-name{font-weight:500}
.cell-name{font-weight:500}
.cell-date{font-size:12px;color:var(--text-muted);white-space:nowrap}
.cell-actions{white-space:nowrap}
.action-btn{background:none;border:none;cursor:pointer;padding:3px 5px;font-size:14px;opacity:.6;transition:opacity .2s;font-family:inherit}
.action-btn:hover{opacity:1}
.action-delete:hover{color:var(--danger)}
.action-edit:hover{color:var(--primary)}
.form-container{max-width:900px}
.form-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group-full{grid-column:1/-1}
.form-group label{font-size:13px;font-weight:500;color:var(--text-secondary)}
.required{color:var(--danger)}
.form-group input,.form-group select,.form-group textarea{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;background:var(--card-bg);width:100%}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(46,125,50,.12)}
.filter-bar{margin-bottom:10px;background:var(--card-bg);padding:7px 10px;border-radius:var(--radius);box-shadow:var(--shadow)}
.filter-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-group{display:flex;flex-direction:column;gap:2px;flex:0 0 auto;min-width:118px}
.filter-group label{font-size:11px;color:var(--text-secondary);font-weight:500;line-height:1.2}
.filter-group input,.filter-group select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--card-bg);outline:none;font-family:inherit;height:30px}
.filter-actions{display:flex;gap:6px;align-items:center;margin-left:auto}
.status-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
/* CI 类型标签 — 区分运营CI与历史CI（仅展示） */
.ci-type-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap}
.ci-type-op{background:#e6f7ff;color:#0958d9;border:1px solid #91caff}
.ci-type-hist{background:#fff7e6;color:#d46b08;border:1px solid #ffd591}
/* 动销判断列：主标签 + 风险小标签分层展示 */
.sales-judgement{display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.35}
.sj-status{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;background:#eef2f7;color:#1a1a2e;white-space:nowrap}
.sj-tags{display:flex;flex-wrap:wrap;gap:3px}
.sj-tag{display:inline-block;padding:0 6px;border-radius:8px;font-size:10px;line-height:1.5;background:#fde8e8;color:#b71c1c;white-space:nowrap}
.status-normal{background:#e8f5e9;color:#2e7d32}
.status-pending{background:#fff3e0;color:#e65100}
.status-approved{background:#e8f5e9;color:#2e7d32}
.status-rejected{background:#fde8e8;color:#b71c1c}
.status-completed{background:#e8f5e9;color:#1b5e20}
.status-draft{background:#f5f5f5;color:#757575}
.status-paid{background:#e8f5e9;color:#1b5e20}
.status-unpaid{background:#fde8e8;color:#b71c1c}
.status-shipped{background:#e3f2fd;color:#1565c0}
.status-partial{background:#fff8e1;color:#f9a825}
.status-cancelled{background:#f5f5f5;color:#999}
.status-warning{background:#fff3e0;color:#e65100}
.status-danger{background:#fde8e8;color:#b71c1c}
.toast-container{position:fixed;top:72px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:420px}
.toast{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);background:var(--card-bg);border-left:4px solid var(--primary);font-size:13px;pointer-events:auto}
.toast-success{border-left-color:var(--success)}
.toast-danger{border-left-color:var(--danger)}
.toast-warning{border-left-color:var(--warning)}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card-bg);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.2);max-width:700px;width:90%;max-height:90vh;overflow-y:auto}
.modal-ci-create{max-width:1200px}
#ci-summary{border-top:2px solid var(--border);margin-top:12px;padding-top:12px}
#ci-summary .summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
#ci-summary .summary-item{text-align:center}
#ci-summary .summary-label{font-size:11px;color:var(--text-muted);margin-bottom:2px}
#ci-summary .summary-value{font-size:15px;font-weight:600}
#ci-summary .summary-value.highlight{color:#1677ff}
.modal-header{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:18px;font-weight:700}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text-muted);padding:0 8px}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;row-gap:8px}
/* RC-C 英文布局兼容：仅新增规则，不删除既有 nowrap / 不改结构 / 不隐藏内容 */
.modal-footer .btn{white-space:normal;word-break:break-word;overflow-wrap:anywhere;min-width:0;text-align:center}
.modal-body{overflow-wrap:anywhere;word-break:break-word}
/* 长文本按钮（如顶部/侧边/筛选区）在窄屏允许换行，避免撑破容器 */
.btn{max-width:100%}
.topnav{overflow-x:auto}
.sidebar-item,.topnav-item{overflow:hidden}
.modal-lg{max-width:1120px;width:96%;max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.modal-lg .modal-header{flex:0 0 auto}
.modal-lg .modal-body{flex:1 1 auto;overflow-y:auto}
.modal-lg .modal-footer{flex:0 0 auto}
/* CI/PL creation modal — positioned within workspace, not covering nav/sidebar */
.modal-overlay.ci-mode{top:48px;left:220px;right:0;bottom:0;width:auto;height:auto;align-items:flex-start;justify-content:flex-start;padding:12px 16px;z-index:100}
.modal-overlay.ci-mode.ci-sb-collapsed{left:54px}
.modal-overlay.ci-mode .modal-ci-create{width:100%;max-width:none;max-height:calc(100vh - 48px - 24px);display:flex;flex-direction:column;overflow:hidden}
.modal-overlay.ci-mode .modal-ci-create .modal-header{flex:0 0 auto}
.modal-overlay.ci-mode .modal-ci-create .modal-body{flex:1 1 auto;overflow-y:auto;min-height:0}
.modal-overlay.ci-mode .modal-ci-create .modal-footer{flex:0 0 auto}
/* CI detail table — internal scroll, preventing page growth */
#ci-items-preview{max-height:min(350px,38vh);overflow-y:auto}
#hci-items-preview{max-height:min(350px,38vh);overflow-y:auto}
/* CI detail table — sticky header */
#ci-items-preview .ci-detail-table thead th,
#hci-items-preview .ci-detail-table thead th{position:sticky;top:0;background:#f5f5f5;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,0.06)}
/* CI detail table — fixed layout + column alignment (unified for both operational & historical CI) */
.ci-detail-table{table-layout:fixed;width:100%;border-collapse:collapse}
.ci-detail-table th,.ci-detail-table td{padding:6px 8px;vertical-align:middle}
.ci-col-sku{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-col-pi{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-col-right{text-align:right}
.ci-col-act{text-align:center}
/* CI detail table inputs — fill cell, right-aligned for numeric columns */
.ci-detail-table input[type="number"]{padding:4px 6px;border:1px solid #d9d9d9;border-radius:3px;font-size:12px;box-sizing:border-box;width:100%}
.ci-detail-table .ci-col-right input[type="number"]{text-align:right;padding-right:8px}
/* Summary bar alignment */
.ci-summary-bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px}
.ci-summary-bar .ci-sum-right{font-weight:bold;text-align:right}
/* ===== 订单预测 Review 专属宽弹窗（不影响其他 modal） ===== */
.rp-review-modal{max-width:1100px;width:min(1100px,calc(100vw - 48px));max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.rp-review-modal .modal-header{flex:0 0 auto}
.rp-review-modal .modal-body{flex:1 1 auto;overflow-y:auto}
.rp-review-modal .modal-footer{flex:0 0 auto}
/* Review 弹窗 Assessment Reason：上下排列，各占整行，多句长文本阅读优化 */
.rp-review-reason-wrap{display:flex;flex-direction:column;gap:20px}
.rp-review-reason-item{display:flex;flex-direction:column;gap:6px;padding:10px 14px;background:#fafbfc;border-radius:6px}
.rp-review-reason-text{font-size:14px;font-weight:500;color:var(--text);line-height:1.55;white-space:normal;word-break:normal;overflow-wrap:anywhere}
/* ===== Phase 3-F2P-2：PI 专用宽弹窗 ===== */
.modal-pi{position:fixed;display:flex;flex-direction:column;overflow:hidden;max-width:none;max-height:calc(100vh - 48px - 24px);top:calc(48px + 12px)}
.modal-pi.pi-sidebar-expanded{left:calc(140px + 14px);width:calc(100vw - 140px - 28px)}
.modal-pi.pi-sidebar-collapsed{left:calc(54px + 14px);width:calc(100vw - 54px - 28px)}
.modal-pi .modal-header{flex:0 0 auto}
.modal-pi .modal-body{flex:0 1 auto;overflow-y:auto;overflow-x:hidden}
.modal-pi .modal-footer{flex:0 0 auto}
/* View PI 响应式基础信息网格：4/3/2/1 列断点（使用高特异性选择器覆盖全局 .detail-grid） */
.modal-pi .detail-grid.detail-grid-pi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:1439px){.modal-pi .detail-grid.detail-grid-pi{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1099px){.modal-pi .detail-grid.detail-grid-pi{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:767px){.modal-pi .detail-grid.detail-grid-pi{grid-template-columns:1fr}}
/* PI 表格区域独立横向滚动（modal 内不横向滚动） */
.modal-pi .pi-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.modal-pi .pi-table-scroll table{min-width:max-content}
.modal-pi .pi-table-scroll thead th{position:sticky;top:0;z-index:2;background:#fafbfc}
/* ===== Phase 3-UX-ROW-DETAIL-01：整行点击查看详情视觉反馈 ===== */
.clickable-detail-row{cursor:pointer}
.clickable-detail-row:hover{background:#f0f7ff}
.drawer-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.35);z-index:1100}
.drawer-overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;width:440px;max-width:92vw;height:100%;background:var(--card-bg,#fff);box-shadow:-8px 0 30px rgba(0,0,0,.18);z-index:1101;transform:translateX(100%);transition:transform .25s ease;overflow:hidden;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:16px 20px;border-bottom:1px solid var(--border,#e6e6e6);display:flex;justify-content:space-between;align-items:flex-start}
.drawer-body{padding:16px 20px;flex:1 1 auto;overflow-y:auto}
.pc-modal{max-width:560px}
.pc-modal-hint{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.5}
.pc-modal-error{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;background:#fff1f0;border:1px solid #ffccc7;color:#cf1322;font-size:13px;line-height:1.6}
.pe-modal-error{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;background:#fff1f0;border:1px solid #ffccc7;color:#cf1322;font-size:13px;line-height:1.6}
.pi-cmp-table thead th{position:sticky;top:0;z-index:2;background:#fafbfc}
/* PI 表格对齐修复（PI-TABLE-ALIGN-01 R4）：三套独立 class + 像素列宽 + 横向滚动，不再用百分比强塞 */
/* 规则：表头数字居中、SKU左、Status左、Actions居中；表体数字居中、SKU左、Status左、Actions居中；数字输入框居中 */
/* 1. Create/Edit 可编辑对比表 .pi-cmp-editable（10列，末列=Actions，总宽1380px） */
.modal-pi .pi-cmp-editable{table-layout:fixed;width:1380px}
.modal-pi .pi-cmp-editable th,.modal-pi .pi-cmp-editable td{text-align:center}
.modal-pi .pi-cmp-editable th:first-child,.modal-pi .pi-cmp-editable td:first-child{text-align:left}
.modal-pi .pi-cmp-editable td input{width:100%;box-sizing:border-box;height:28px;padding:2px 6px;margin:0}
.modal-pi .pi-cmp-editable td input[type="number"],.modal-pi .pi-cmp-editable td input[type="text"]{text-align:center}
/* 2. PI Details Items 只读表 .pi-items-readonly（8列，全数字，总宽1165px） */
.modal-pi .pi-items-readonly{table-layout:fixed;width:1165px}
.modal-pi .pi-items-readonly th,.modal-pi .pi-items-readonly td{text-align:center}
.modal-pi .pi-items-readonly th:first-child,.modal-pi .pi-items-readonly td:first-child{text-align:left}
/* 3. PI Details Variance 只读表 .pi-cmp-readonly（10列，末列=Status，总宽1510px） */
.modal-pi .pi-cmp-readonly{table-layout:fixed;width:1510px}
.modal-pi .pi-cmp-readonly th,.modal-pi .pi-cmp-readonly td{text-align:center}
.modal-pi .pi-cmp-readonly th:first-child,.modal-pi .pi-cmp-readonly td:first-child{text-align:left}
.modal-pi .pi-cmp-readonly th:last-child,.modal-pi .pi-cmp-readonly td:last-child{text-align:left}
/* 汇总/Total 行：文案左对齐，数字居中落对应列，末格金额差异右对齐 */
.modal-pi .pi-cmp-editable tfoot td:first-child,.modal-pi .pi-cmp-readonly tfoot td:first-child{text-align:left}
.modal-pi .pi-cmp-editable tfoot td[colspan],.modal-pi .pi-cmp-readonly tfoot td[colspan]{text-align:right}
/* PI 弹窗定金比例字段：隐藏 number input 原生 spinner，保留数字输入能力（仅影响 .modal-pi 作用域，不影响其他页面） */
.modal-pi .form-group input[type="number"]::-webkit-outer-spin-button,
.modal-pi .form-group input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.modal-pi .form-group input[type="number"]{-moz-appearance:textfield}
/* ===== 订单预测：字段配置面板 ===== */
.rp-cfg-panel{padding:0 4px}
.rp-cfg-toolbar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.rp-cfg-search{flex:1;padding:7px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--card-bg);color:var(--text);outline:none}

.rp-cfg-stats{font-size:12px;color:var(--text-secondary);margin-bottom:8px;font-weight:600}

.rp-cfg-item:hover{background:var(--bg)}

.rp-cfg-handle{cursor:grab;color:var(--text-muted);font-size:18px;flex-shrink:0;user-select:none;width:20px;text-align:center;line-height:1}
.rp-cfg-handle:active{cursor:grabbing}
.rp-cfg-name{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-cfg-badge-fixed{font-size:11px;padding:2px 8px;background:var(--primary-light);color:var(--primary);border-radius:4px;flex-shrink:0;font-weight:600}
.rp-cfg-item.rp-cfg-dragging{opacity:.35;background:var(--primary-light)!important}
.rp-cfg-item.rp-cfg-drop-above{box-shadow:0 -2px 0 0 var(--primary)}
.rp-cfg-item.rp-cfg-drop-below{box-shadow:0 2px 0 0 var(--primary)}
.rp-cfg-switch{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0;margin:0;cursor:pointer}
.rp-cfg-switch input{opacity:0;width:0;height:0;position:absolute}
.rp-cfg-slider{position:absolute;inset:0;background:#ccc;transition:.2s;border-radius:20px}

.rp-cfg-switch input:checked + .rp-cfg-slider{background:var(--primary)}

/* 冻结到此列单选控件 */
.rp-cfg-freeze-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;margin-bottom:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px}
.rp-cfg-freeze-none{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text)}

.rp-cfg-freeze input[type="radio"]{cursor:pointer}
.rp-cfg-freeze input[type="radio"]:disabled{cursor:not-allowed;opacity:.4}
.rp-cfg-freeze input[type="radio"]:checked + span{color:var(--primary);font-weight:600}
.rp-cfg-freeze-none input[type="radio"]{cursor:pointer}
.rp-cfg-freeze-none input[type="radio"]:checked + span{color:var(--primary);font-weight:600}
.rp-cfg-item-hidden .rp-cfg-freeze{pointer-events:none}
.rp-cfg-switch input:disabled + .rp-cfg-slider{opacity:.4;cursor:not-allowed}

.chart-canvas-wrapper{position:relative;height:300px}
/* SKU动销与订单预测 - KPI指标卡 */
.kpi-row{margin:12px 20px 0}
.kpi-grid{display:flex;gap:12px;flex-wrap:wrap}
.kpi-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px 16px;min-width:110px;flex:1;text-align:center;transition:all .2s}
.kpi-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.kpi-label{font-size:11px;color:var(--text-muted);margin-bottom:4px}
.kpi-value{font-size:22px;font-weight:700;color:var(--text)}
.kpi-warn{color:var(--danger)!important}
.kpi-unit{font-size:10px;color:var(--text-muted);margin-top:2px}
.kpi-danger .kpi-value{color:var(--danger)}
.kpi-accent .kpi-value{color:var(--primary)}
.kpi-muted .kpi-value{color:var(--text-muted)}
/* 订单预测 - 顶部筛选区+指标卡 收起/展开 */
#rp-collapsible.rp-collapsed{display:none}
.rp-collapse-btn{min-width:64px;text-align:center}
/* Tab栏 */
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin:12px 20px 0}
.tab-item{padding:8px 18px;cursor:pointer;font-size:13px;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-item:hover{color:var(--text);background:var(--bg)}
.tab-item.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;background:transparent}
/* 按月/按天切换 */
.rp-mode-switch{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.rp-mode-btn{padding:3px 12px;border:none;background:transparent;font-size:12px;color:var(--text-secondary);cursor:pointer;transition:all .15s}
.rp-mode-btn:hover{background:rgba(0,0,0,.05)}
.rp-mode-btn.active{background:var(--primary);color:#fff;font-weight:600}
/* 按天模式日期列 */
.daily-sales-cell{text-right;font-size:11px;min-width:42px;text-align:right}
.daily-sales-zero{color:var(--text-tertiary,#aaa);font-size:10px}
.trend-up{color:var(--success,#16a34a)}
.trend-down{color:var(--danger,#dc2626)}
.trend-flat{color:var(--text-tertiary,#aaa)}
/* 按天模式冻结列/汇总行 */
.daily-table-wrap table{border-collapse:separate!important;border-spacing:0!important}
.daily-table-wrap th,.daily-table-wrap td{border-bottom:1px solid var(--border,#e5e7eb)}
.daily-table-wrap tbody tr:hover td[style*="sticky"]{background:#f0f4ff!important}
/* 按天非冻结列 hover 背景补齐（冻结列由上一条 !important 规则覆盖，保持一致） */
.daily-table-wrap tbody tr:hover td{background:#f0f4ff}
.daily-table-wrap thead tr:nth-child(2) td{border-bottom:2px solid var(--border,#c5cad3)!important}
.daily-table-wrap thead tr:nth-child(2){box-shadow:0 2px 4px rgba(0,0,0,.08)}
/* 按天表头允许自动换行（英文/印尼文较长文案不被截断）；优先在空格处断行 */
.daily-table-wrap .rp-daily-th{white-space:normal;line-height:1.3;overflow-wrap:normal;word-break:normal;hyphens:none;vertical-align:middle;padding:6px 4px;height:auto}
.daily-table-wrap thead th{vertical-align:middle}
/* 按月模式冻结表头+汇总行 */
.rp-monthly-table{border-collapse:separate!important;border-spacing:0!important;table-layout:fixed}
.rp-monthly-table thead th{position:sticky;top:0;z-index:3;background:#fafbfc;white-space:normal;line-height:1.35;overflow-wrap:normal;word-break:normal;hyphens:none;vertical-align:middle}
.rp-monthly-table .rp-summary-row td{position:sticky;top:34px;z-index:2;background:#e8edf3;font-weight:700;font-size:12px;border-bottom:2px solid var(--border,#c5cad3)!important;box-shadow:0 2px 4px rgba(0,0,0,.08)}
.rp-monthly-table tbody tr:hover td{background:#f8f9ff}
/* 渠道表格冻结列（动态设置 left，此处仅定义基础样式） */
.rp-monthly-table .rp-freeze-cell{position:sticky;z-index:1;background:var(--bg-card,#fff)}
.rp-monthly-table thead .rp-freeze-cell{z-index:5;background:#fafbfc}
.rp-monthly-table .rp-summary-row .rp-freeze-cell{z-index:4;background:#e8edf3}
.rp-monthly-table tbody tr:hover .rp-freeze-cell{background:#f8f9ff}
/* 冻结区最右侧字段：常驻右侧阴影，作为冻结区与滚动区的唯一视觉分隔（不叠 border-right，避免双线） */
.rp-monthly-table .rp-freeze-last{box-shadow:2px 0 6px rgba(0,0,0,0.12)}
.rp-monthly-table thead .rp-freeze-last{box-shadow:2px 0 6px rgba(0,0,0,0.12)}
.rp-monthly-table .rp-summary-row .rp-freeze-last{box-shadow:2px 0 6px rgba(0,0,0,0.12)}
.rp-monthly-table tbody tr:hover .rp-freeze-last{box-shadow:2px 0 6px rgba(0,0,0,0.12)}
/* 渠道表格容器需 relative，作为冻结线 absolute 定位基准 */
#rp-table .table-container{position:relative}
/* ===== ORDER-FORECAST-FIXED-COLUMNS-01：固定列宽 + colgroup ===== */
/* colgroup 统一列宽：header/summary/body 共用，保证严格对齐 */
.rp-monthly-table colgroup col{display:table-column}
/* 紧凑表头：允许换行，不拆散术语，不省略 */
.rp-monthly-table thead th.rp-th-compact{white-space:normal;line-height:1.3;overflow-wrap:normal;word-break:normal;hyphens:none;vertical-align:middle;padding:6px 8px}
/* 问号 tooltip 图标 */
.rp-monthly-table .rp-th-help{display:inline-block;width:10px;height:10px;margin-left:3px;vertical-align:middle;cursor:help;border-radius:50%;background:#bbb;color:#fff;font-size:9px;line-height:10px;text-align:center;position:relative}
.rp-monthly-table .rp-th-help:hover{background:var(--primary,#2e7d32)}
.rp-monthly-table .rp-th-help::after{content:"?"}
/* 订单预测数字列统一居中对齐（覆盖全局 .text-right 的右对齐，仅作用于 .rp-monthly-table） */
.rp-monthly-table th.text-right,.rp-monthly-table td.text-right{text-align:center}
.rp-monthly-table .rp-target-turn,.rp-monthly-table .rp-target-stock-input{text-align:center}
/* 数字列保持单行不换行（防止数据被遮挡） */
.rp-monthly-table td.text-right{white-space:nowrap}
.rp-monthly-table td.cell-id{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Model 列保持单行 */
.rp-monthly-table td.text-truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 长文本列（Suggested Action / Sales Reason / AI Business Advice / Risk Tags / Suggestion）：自然换行，不裁切 */
.rp-monthly-table td.rp-cell-wrap{white-space:normal;overflow-wrap:break-word;word-break:normal;vertical-align:top}
/* 订单预测专属：Movement Judgment / Sales Status / Risk Tags 防溢出 */
.rp-monthly-table td.rp-movement-cell{overflow:hidden;overflow-wrap:break-word;word-break:normal}
.rp-monthly-table td.rp-movement-cell .sales-judgement{max-width:100%;overflow:hidden}
.rp-monthly-table td.rp-movement-cell .sj-status{white-space:normal;max-width:100%;word-break:normal}
.rp-monthly-table td.rp-movement-cell .sj-tags{flex-wrap:wrap;gap:3px;max-width:100%}
.rp-monthly-table td.rp-movement-cell .sj-tag{white-space:normal;max-width:100%;word-break:normal}
.rp-monthly-table td.rp-sales-status-cell{overflow:hidden}
.rp-monthly-table td.rp-sales-status-cell .status-badge{white-space:normal;max-width:100%;word-break:normal;overflow-wrap:break-word}
.rp-monthly-table td.rp-risk-tags-cell{overflow:hidden}
.rp-monthly-table td.rp-risk-tags-cell .sj-tags{flex-wrap:wrap;gap:3px;max-width:100%}
.rp-monthly-table td.rp-risk-tags-cell .sj-tag{white-space:normal;max-width:100%;word-break:normal}
/* 订单预测建议采购输入框：去掉 number input 默认上下箭头 */
.rp-target-stock-input::-webkit-outer-spin-button,
.rp-target-stock-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rp-target-stock-input{-moz-appearance:textfield}
/* 字段说明 tooltip（Shopee 风格问号图标 + 气泡）
   说明气泡渲染到 body 下的 #global-tooltip，避免被 table-container overflow 裁剪 */
.rp-th-help{display:inline-block;width:14px;height:14px;margin-left:3px;vertical-align:middle;cursor:help;position:relative}
.rp-th-help::before{content:'?';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:14px;height:14px;line-height:14px;text-align:center;border-radius:50%;background:#e0e4ea;color:#8a94a6;font-size:10px;font-weight:700;transition:background .15s,color .15s}
.rp-th-help:hover::before{background:#3370ff;color:#fff}
#global-tooltip{position:fixed;z-index:10000;max-width:280px;background:#1f2329;color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,0.24);opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s;pointer-events:none}
#global-tooltip.visible{opacity:1;visibility:visible}
#global-tooltip::after{content:'';position:absolute;left:50%;transform:translateX(-50%);border:6px solid transparent}
#global-tooltip.tip-above::after{top:100%;border-top-color:#1f2329}
#global-tooltip.tip-below::after{bottom:100%;border-bottom-color:#1f2329}
/* 飞书风格冻结拖拽线：透明载体（仅作拖拽热区+蓝柄载体，不承担灰线视觉，避免与 box-shadow 双线） */
.rp-freeze-line{position:absolute;top:0;bottom:0;width:1px;background:transparent;z-index:8;cursor:col-resize}
.rp-freeze-line::before{content:'';position:absolute;top:50%;left:-3px;width:6px;height:36px;border-radius:4px;background:#3370ff;opacity:0;transform:translateY(-50%);transition:opacity .15s,width .15s;pointer-events:none}
.rp-freeze-line::after{content:'';position:absolute;top:0;bottom:0;left:-5px;width:10px}
.rp-freeze-line:hover::before,.rp-freeze-line.dragging::before{opacity:1;width:7px;left:-3px}
.rp-freeze-line.hidden{display:none}
.rp-freeze-line-tooltip{position:absolute;top:50%;left:10px;transform:translateY(-50%);background:#3370ff;color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.rp-freeze-line:hover .rp-freeze-line-tooltip{opacity:1}
/* 拖动落点提示线（拖动过程中显示，吸附到列边界） */
.rp-freeze-drop-line{position:absolute;top:0;bottom:0;width:2px;background:#3370ff;z-index:9;pointer-events:none;opacity:0;transition:opacity .1s}
.rp-freeze-drop-line.visible{opacity:1}
@keyframes rpFadeOut{from{opacity:1}to{opacity:0}}
/* 生命周期标签 */
.lifecycle-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap}
/* 按天表 Lifecycle 标签允许自然换行（最多2行），英文/印尼文长名称不截断 */
.daily-table-wrap .lifecycle-tag{white-space:normal;word-break:keep-all;line-height:1.25}
.lc-new_test{background:#e3f2fd;color:#1565c0;border:1px solid #bbdefb}
.lc-new_launch{background:#e1f5fe;color:#0277bd;border:1px solid #b3e5fc}
.lc-growth{background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9}
.lc-stable{background:#f3e5f5;color:#6a1b9a;border:1px solid #e1bee7}
.lc-slow{background:#fff3e0;color:#e65100;border:1px solid #ffe0b2}
.lc-stagnant{background:#fbe9e7;color:#bf360c;border:1px solid #ffccbc}
.lc-clearance{background:#ffebee;color:#c62828;border:1px solid #ffcdd2}
.lc-stopped{background:#eceff1;color:#455a64;border:1px solid #cfd8dc}
.link-text{color:var(--primary);text-decoration:none}
.link-text:hover{text-decoration:underline}
/* 审批中心 */
.approval-tabs{display:flex;gap:6px;padding:14px 16px 0;flex-wrap:wrap;border-bottom:1px solid #eee}
.approval-tab{padding:8px 14px;cursor:pointer;border-radius:6px 6px 0 0;font-size:14px;color:#666;border:1px solid transparent;border-bottom:none}
.approval-tab:hover{background:#f5f5f5}
.approval-tab.active{color:var(--primary);font-weight:600;border-color:#e0e0e0;background:#fff;border-bottom:2px solid #fff;margin-bottom:-1px}
.muted-hint{font-size:12px;color:#999}
.approval-timeline{list-style:none;margin:0;padding:0}
.approval-timeline .tl-item{padding:10px 0;border-bottom:1px dashed #eee}
.approval-timeline .tl-item:last-child{border-bottom:none}
.approval-timeline .tl-action{font-size:14px}
.approval-timeline .tl-meta{font-size:12px;color:#888;margin-top:2px}
.approval-timeline .tl-remark{font-size:13px;color:#555;margin-top:4px}
/* 供应商付款条件子表 */
.sup-terms-section{margin-top:18px;border-top:1px dashed var(--border);padding-top:14px}
.sup-terms-head{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)}
.sup-terms-empty{color:#999;font-size:13px;padding:10px 0 12px}
.sup-term-card{display:flex;align-items:flex-start;gap:8px;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px}
.sup-term-idx{flex:0 0 20px;height:20px;line-height:20px;text-align:center;background:var(--accent,#3b7ddd);color:#fff;border-radius:50%;font-size:12px;margin-top:18px}
.sup-term-fields{flex:1;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.sup-term-field{display:flex;flex-direction:column;gap:3px}
.sup-term-field>label{font-size:12px;color:#888}
.sup-term-field input[type=text],.sup-term-field input[type=number],.sup-term-field select{height:32px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;min-width:150px}
.sup-term-field.st-credit-box>input{min-width:110px}
.sup-term-default,.sup-term-del{justify-content:flex-end;padding-bottom:2px}
.sup-term-del .action-del{border:none;background:transparent;font-size:16px;cursor:pointer}
.hidden{display:none!important}
/* ===== 付款类目管理（L1B-2 三栏骨架） ===== */
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:16px}
.pc-title{font-size:20px;font-weight:700}
.pc-desc{font-size:13px;color:var(--text-secondary);margin-top:4px;max-width:900px;line-height:1.5}
.pc-head-actions{display:flex;gap:10px;flex-shrink:0;align-items:center}
.payment-category-columns{display:grid;grid-template-columns:minmax(280px,24%) minmax(380px,38%) minmax(380px,38%);gap:14px;width:100%;max-width:none;align-items:start}
.col-pc-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.col-pc-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.col-pc-title{font-size:15px;font-weight:600}
.col-pc-title .pc-sub{font-size:13px;color:var(--text-muted);font-weight:500}
.col-pc-body{padding:8px 8px 12px;overflow-y:auto;max-height:calc(100vh - 230px)}
.pc-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;margin-bottom:4px;border-left:3px solid transparent;background:#fff;cursor:pointer}
.pc-row:hover{background:var(--bg)}
.pc-row.selected{border-left-color:var(--primary);background:var(--primary-light)}
.pc-main{flex:1;min-width:0}
.pc-name{font-size:14px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-code{font-size:11px;color:var(--text-muted);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-code-inline{font-size:11px;color:var(--text-muted);font-family:monospace}
.pc-meta{font-size:11px;color:var(--text-secondary);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-actions{display:flex;gap:4px;flex-shrink:0;align-items:center}
.pc-edit{font-size:12px;padding:3px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.pc-edit:hover{background:var(--bg);color:var(--primary)}
.pc-toggle{font-size:12px;padding:3px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.pc-toggle:hover{background:var(--bg)}
.pc-hint{margin:10px 12px 6px;padding:8px 12px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--text-secondary);line-height:1.5}
.pc-hint b{color:var(--text)}
.status-disabled{background:#f0f0f0;color:#999}
.pc-loading{padding:28px;text-align:center;color:var(--text-muted);font-size:13px}
.pc-empty{padding:28px 14px;text-align:center;color:var(--text-muted);font-size:13px}
.pc-empty .pc-empty-icon{font-size:26px;margin-bottom:6px;display:block}
.pc-readonly-banner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff8e6;border:1px solid #f0e0b0;border-radius:8px;color:#8a6d1a;font-size:12px;margin-bottom:12px}
.login-card .btn-feishu{background:#3370ff;border:none}
.login-card .btn-feishu:hover{background:#285ce0}
.login-card .bg-toggle{margin-top:18px;font-size:13px}
.login-card .bg-toggle a{color:var(--text-secondary);text-decoration:none;border-bottom:1px dashed var(--border)}
.login-card .bg-toggle a:hover{color:var(--primary)}
.login-card #bg-form{margin-top:14px}
.login-card .btn-secondary{background:#eeeeee;color:#333;border:none}
.login-card .btn-secondary:hover{background:#e0e0e0}
.status-active{background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:6px;font-size:12px}
.status-pending{background:#fff3cd;color:#f57f17;padding:2px 8px;border-radius:6px;font-size:12px}
.user-role-sel{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit}
/* PUR-OPS-COLLAB-01：上架准备分区 */
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.badge-success{background:#e8f5e9;color:#2e7d32}
.badge-warning{background:#fff3cd;color:#f57f17}
.cc-list{display:flex;flex-wrap:wrap;gap:8px;max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--bg-card,#fff)}
.cc-check{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:400;margin:0;cursor:pointer}
</style>
</head>
<body>
<div id="login-page" class="login-page">
  <div class="login-container"><div class="login-card">
    <h1 data-i18n="auth.login_title">📦 进销存管理系统</h1>
    <p data-i18n="auth.login_subtitle">采购 · 库存 · 成本 · 付款全流程管理</p>
    <button onclick="doFeishuLogin()" id="login-btn" class="btn-feishu" data-i18n="auth.feishu_login">🔵 使用飞书登录</button>
    <div class="login-hint"><strong data-i18n="auth.recommend_title">推荐使用飞书账号登录</strong><br><span data-i18n="auth.recommend_hint">首次登录将由管理员启用并分配权限。</span></div>
    <div class="bg-toggle"><a href="javascript:void(0)" onclick="toggleBreakGlass()" data-i18n="auth.breakglass_link">本地应急登录</a></div>
    <div id="bg-form" style="display:none">
      <input type="text" id="bg-username" placeholder="应急账号" data-i18n="auth.bg_username_ph" data-i18n-attr="placeholder" onkeydown="if(event.key==='Enter')doBreakGlassLogin()">
      <input type="password" id="bg-password" placeholder="应急密码" data-i18n="auth.bg_password_ph" data-i18n-attr="placeholder" onkeydown="if(event.key==='Enter')doBreakGlassLogin()">
      <button onclick="doBreakGlassLogin()" class="btn-secondary" data-i18n="auth.breakglass_login_btn">应急登录</button>
    </div>
  </div></div>
</div>
<div id="pending-page" class="login-page" style="display:none">
  <div class="login-container"><div class="login-card">
    <h1 data-i18n="pending.title">⏳ 账号待授权</h1>
    <p data-i18n="pending.recognized">您的飞书账号已成功识别</p>
    <p id="pending-name" style="font-weight:600;color:var(--text);margin-bottom:8px"></p>
    <div class="login-hint"><strong data-i18n="pending.wait_title">账号已识别，等待管理员授权</strong><br><span data-i18n="pending.wait_hint">管理员启用并分配角色后，您即可进入业务系统。如有疑问请联系系统管理员。</span></div>
    <button onclick="doLogout()" class="btn-secondary" data-i18n="pending.logout_btn">退出登录</button>
  </div></div>
</div>
<div id="app" class="app-shell" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-header"><a class="sidebar-brand"><span class="brand-icon">📦</span><span id="sidebar-module-title" data-i18n="nav.app_title">进销存系统</span></a><button class="sidebar-collapse-btn" onclick="toggleSidebar()" data-i18n="nav.toggle_sidebar" data-i18n-attr="title" title="折叠/展开菜单">«</button></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer" data-i18n="sidebar.footer">v1.0.0 本地</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <nav class="topnav" id="topnav"></nav>
      <div class="topbar-right">
        <div class="user-menu"><div class="user-avatar" id="user-avatar">A</div>
          <div class="user-info"><span class="user-name" id="user-name">admin</span><span class="user-role" id="user-role">—</span></div>
        </div>
        <select id="lang-switcher" class="user-role-sel" onchange="setLang(this.value)" data-i18n="lang.switcher_title" data-i18n-attr="title" title="语言">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="id">Bahasa</option>
        </select>
        <button class="logout-btn" onclick="doLogout()" data-i18n="common.logout">退出</button>
      </div>
    </header>
    <div class="content"><div class="content-inner" id="content-inner"></div></div>
  </div>
</div>
<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal-content"></div></div>
<div class="drawer-overlay" id="cockpit-drawer-overlay" onclick="if(event.target===this)closeCockpitDrawer()"></div>
<aside class="drawer" id="cockpit-drawer"></aside>
<div id="global-tooltip"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
