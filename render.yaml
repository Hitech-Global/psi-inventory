# Render 部署配置（Infrastructure as Code）
# 架构：Render Free Web Service + Supabase PostgreSQL (Singapore)
# 休眠防护：UptimeRobot 每5分钟探活 /api/auth/feishu/status
#
# 安全：本文件不含任何密钥。密钥/域名相关变量用 sync:false 交由 Render 后台注入，
#       绝不在 git 提交真实值（.env 已被 .gitignore 保护）。

services:
  - type: web
    name: psi-inventory
    runtime: node
    region: singapore             # 与 Supabase Singapore 同区，数据库延迟最低
    branch: main                  # GitHub 自动部署分支
    buildCommand: npm install     # 编译 deasync/better-sqlite3 原生模块
    startCommand: node server.js
    plan: free                    # 免费层：512MB RAM + 750h/月；数据库在 Supabase 不依赖本地磁盘
    numInstances: 1
    healthCheckPath: /api/version # server.js 内置轻量版本端点，返回 200
    envVars:
      # —— 固定值（写入 yaml）——
      - key: NODE_ENV
        value: production         # CSRF 强制 + 错误栈不外露
      - key: DB_DRIVER
        value: pg                 # 使用 PostgreSQL（Supabase），非 SQLite
      - key: COOKIE_SECURE
        value: "1"                # 生产 HTTPS 必须，会话 Cookie 带 Secure
      - key: SESSION_TTL_HOURS
        value: "12"
      # —— 密钥/域名相关（sync:false → Render 后台填写，不入库）——
      - key: DATABASE_URL
        sync: false               # Supabase 连接串（直连端口5432，非Transaction池6543）
      - key: BREAKGLASS_ADMIN_PASSWORD
        sync: false               # 强密码（≥12位含大小写+数字）；缺失/弱值 fail-closed 拒绝启动
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_REDIRECT_URI
        sync: false               # 部署后填 https://<render-domain>/api/auth/feishu/callback
      - key: TRUSTED_ORIGINS
        sync: false               # 部署后填 https://<render-domain>（CSRF 写请求必须，否则 403）
