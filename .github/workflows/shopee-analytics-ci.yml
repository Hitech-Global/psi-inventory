name: Shopee Analytics CI

on:
  pull_request:
    paths:
      - "shopee-analytics/**"
      - "skills/shopee-gmv-max/**"
      - ".github/workflows/shopee-analytics-ci.yml"
  # 直推分支也必须跑 CI：此前只有 pull_request 触发，
  # 直接 push 到分支的提交会绕过校验（曾出现标签契约被破坏但 CI 未跑的情况）。
  #
  # 用通配而非枚举具体分支名：新增开发线（例如 TikTok 的
  # feat/tiktok-m0-foundation）时，枚举式配置会让该分支的提交静默绕过校验，
  # 与当初引入 push 触发器要解决的问题是同一个。
  #
  # `fix/**` 同样要覆盖：生产部署的是 fix/shopee-brand-portal-modern-oauth-20261027，
  # 那条线上的提交也必须过校验，否则线上基线的改动可以绕过检查。
  push:
    branches:
      - "feat/**"
      - "fix/**"
    paths:
      - "shopee-analytics/**"
      - "skills/shopee-gmv-max/**"
      - ".github/workflows/shopee-analytics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shopee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime dependencies without repo postinstall
        run: npm ci --ignore-scripts
      - name: Run Shopee analytics pure tests
        run: node shopee-analytics/test/run-all.cjs
      - name: Run PostgreSQL integration test
        env:
          SHOPEE_ANALYTICS_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shopee_test
        run: node shopee-analytics/test/postgres.integration.cjs
      - name: Validate desktop compose and backup scripts
        run: |
          cp shopee-analytics/deploy/desktop/runtime.env.example shopee-analytics/deploy/desktop/runtime/.env 2>/dev/null || {
            mkdir -p shopee-analytics/deploy/desktop/runtime
            cp shopee-analytics/deploy/desktop/runtime.env.example shopee-analytics/deploy/desktop/runtime/.env
          }
          (cd shopee-analytics/deploy/desktop && docker compose --env-file runtime/.env config -q)
          sh -n shopee-analytics/deploy/desktop/backup-postgres.sh
          sh -n shopee-analytics/deploy/desktop/verify-restore.sh

  windows-powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            'shopee-analytics/deploy/desktop/verify-m612-readonly.ps1',
            'shopee-analytics/deploy/deploy-analytics-windows.ps1'
          )
          # 脚本文件必须带 UTF-8 BOM。PowerShell 5.1 读不带 BOM 的 UTF-8 时
          # 按系统 ANSI 码页解码，中文注释会被拆成乱码，某些字节组合还会破坏
          # 语句结构 —— 表现为 cmdlet 收到 null 参数，而不是语法报错。
          $allScripts = Get-ChildItem -Path 'shopee-analytics' -Recurse -Filter '*.ps1'
          foreach ($file in $allScripts) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Error "$($file.FullName) : missing UTF-8 BOM"
              $missingBom = $true
            }
          }
          if ($missingBom) { exit 1 }
          Write-Host "  all $($allScripts.Count) PowerShell scripts carry a UTF-8 BOM"

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              exit 1
            }
            Write-Host "  parsed $script"
          }
          Write-Host 'verify-m612-readonly.ps1 syntax: ok'
