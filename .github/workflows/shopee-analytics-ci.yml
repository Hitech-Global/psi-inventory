name: Shopee Analytics CI

on:
  pull_request:
    paths:
      - "shopee-analytics/**"
      - ".github/workflows/shopee-analytics-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Shopee analytics pure tests
        run: node shopee-analytics/test/run-all.cjs
