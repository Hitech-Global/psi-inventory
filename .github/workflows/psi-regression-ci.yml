name: PSI regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'app-perf.js'
      - 'test/app-perf-diagnostics.test.cjs'
      - 'server.js'
      - 'index.html'
      - 'assets/bigseller-inventory-import.js'
      - 'test/bigseller-inventory-import.test.cjs'
      - 'test/inventory-import-precheck.test.cjs'
      - 'assets/finance-payment-calendar.js'
      - 'test/finance-payment-calendar.test.cjs'
      - 'test/manual-payable-item.test.cjs'
      - 'test/finance-payment-overview-integration.test.cjs'
      - 'po-plan-server.js'
      - 'po-plan-ui.js'
      - 'scripts/po-plan-bootstrap.cjs'
      - 'test/po-plan-quotation-pricing.test.cjs'
      - 'package.json'
      - 'po-number.js'
      - 'wac-calculator.js'
      - 'wac-calculator.test.cjs'
      - 'wac-notification.js'
      - 'wac-notification-ui.js'
      - 'test/wac-cost-change-notification.test.cjs'
      - 'db-pg.js'
      - 'db.js'
      - 'db-sqlite.js'
      - 'test/wac-history-import.test.cjs'
      - 'test/wac-batch-exclusion.test.cjs'
      - 'test/rp-suggested-qty-wheel.test.cjs'
      - 'test/po-number-date-country.test.cjs'
      - 'inventory-asset-values.js'
      - 'test/inventory-asset-values.test.cjs'
      - 'test/inventory-overview-export.test.cjs'
      - 'test/inventory-onhand-local-currency-kpi.test.cjs'
      - 'i18n.js'
      - '.github/workflows/psi-regression-ci.yml'

permissions:
  contents: read

jobs:
  psi-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies without running application postinstall
        run: |
          npm install --ignore-scripts --no-package-lock
          npm rebuild better-sqlite3
      - name: Check frontend and backend syntax
        run: |
          node --check app.js
          node --check app-perf.js
          node --check test/app-perf-diagnostics.test.cjs
          node --check server.js
          node --check assets/bigseller-inventory-import.js
          node --check test/bigseller-inventory-import.test.cjs
          node --check test/inventory-import-precheck.test.cjs
          node --check assets/finance-payment-calendar.js
          node --check test/finance-payment-calendar.test.cjs
          node --check test/manual-payable-item.test.cjs
          node --check po-plan-server.js
          node --check po-plan-ui.js
          node --check scripts/po-plan-bootstrap.cjs
          node --check test/po-plan-quotation-pricing.test.cjs
          node --check po-number.js
          node --check wac-calculator.js
          node --check wac-notification.js
          node --check wac-notification-ui.js
          node --check test/wac-cost-change-notification.test.cjs
          node --check db-pg.js
          node --check db.js
          node --check db-sqlite.js
          node --check i18n.js
          node --check inventory-asset-values.js
          node --check test/inventory-asset-values.test.cjs
          node --check test/inventory-overview-export.test.cjs
          node --check test/inventory-onhand-local-currency-kpi.test.cjs
          node --check test/wac-history-import.test.cjs
          node --check test/wac-batch-exclusion.test.cjs
      - name: Test opt-in page and API performance diagnostics
        run: node --test test/app-perf-diagnostics.test.cjs
      - name: Test finance payment calendar and manual payable creation
        run: node --test test/finance-payment-calendar.test.cjs test/manual-payable-item.test.cjs test/finance-payment-overview-integration.test.cjs test/finance-payment-overview.test.cjs test/finance-payment-overview-sort.test.cjs
      - name: Test PO number date and country format
        run: node test/po-number-date-country.test.cjs
      - name: Test PO latest FOB quotation and FX pricing
        run: node --test test/po-plan-quotation-pricing.test.cjs
      - name: Test BigSeller inventory import adapter and SKU master-data blocking
        run: node --test test/bigseller-inventory-import.test.cjs test/inventory-import-precheck.test.cjs
      - name: Test inventory financial value aggregation
        run: node test/inventory-asset-values.test.cjs
      - name: Test inventory overview export fields
        run: node --test test/inventory-overview-export.test.cjs
      - name: Test inventory on-hand local currency KPI
        run: node --test test/inventory-onhand-local-currency-kpi.test.cjs
      - name: Test WAC calculation and transport-basis rules
        run: node --test wac-calculator.test.cjs
      - name: Test WAC cost-change Feishu notification reports
        run: node --test test/wac-cost-change-notification.test.cjs
      - name: Test suggested purchase quantity wheel behavior
        run: node test/rp-suggested-qty-wheel.test.cjs
      - name: Test WAC history matrix and historical import
        run: node test/wac-history-import.test.cjs
      - name: Test WAC batch exclusion and restore
        run: node test/wac-batch-exclusion.test.cjs
