name: PSI regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'test/ci-logistics-status-filter.test.cjs'
      - 'scripts/ci-edit-before-pl-hotfix.cjs'
      - 'scripts/ci-inline-clearance-hotfix.cjs'
      - 'scripts/ci-historical-clearance-hotfix.cjs'
      - 'migrations/historical-ci-clearance.js'
      - 'test/ci-historical-clearance-hotfix.test.cjs'
      - 'test/ci-unified-table.test.cjs'
      - 'app.js'
      - 'test/ci-inline-clearance-hotfix.test.cjs'
      - 'test/ci-edit-before-pl-hotfix.test.cjs'
      - 'test/ci-clearance-type.test.cjs'
      - 'test/ci-edit-entry-supplier-column.test.cjs'
      - 'test/supplier-pi-preview-alignment.test.cjs'
      - 'app-perf.js'
      - 'test/app-perf-diagnostics.test.cjs'
      - 'test/app-perf-brand-invalidation.test.cjs'
      - 'server.js'
      - 'wave2b-pi-batch-import-pg.js'
      - 'test/pi-deposit-payable-date.test.cjs'
      - 'index.html'
      - 'assets/ci-list-freight.js'
      - 'assets/bigseller-inventory-import.js'
      - 'test/bigseller-inventory-import.test.cjs'
      - 'assets/zhisu-inventory-import.js'
      - 'test/zhisu-inventory-import.test.cjs'
      - 'test/inventory-import-precheck.test.cjs'
      - 'assets/finance-payment-calendar.js'
      - 'test/finance-payment-calendar.test.cjs'
      - 'test/manual-payable-item.test.cjs'
      - 'test/finance-payment-overview-integration.test.cjs'
      - 'po-plan-server.js'
      - 'po-plan-ui.js'
      - 'scripts/po-plan-bootstrap.cjs'
      - 'test/po-plan-quotation-pricing.test.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'po-number.js'
      - 'wac-calculator.js'
      - 'wac-calculator.test.cjs'
      - 'wac-notification.js'
      - 'wac-notification-ui.js'
      - 'test/wac-cost-change-notification.test.cjs'
      - 'test/listing-notification-card.test.cjs'
      - 'db-pg.js'
      - 'db.js'
      - 'db-sqlite.js'
      - 'test/wac-history-import.test.cjs'
      - 'test/wac-batch-exclusion.test.cjs'
      - 'quotation-server.js'
      - 'quotation-import-fast.js'
      - 'quotation-import-normalizer.js'
      - 'quotation-import-progress.js'
      - 'quotation-management.js'
      - 'scripts/quotation-management-bootstrap.cjs'
      - 'test/quotation-smart-import.test.cjs'
      - 'test/rp-suggested-qty-wheel.test.cjs'
      - 'test/po-number-date-country.test.cjs'
      - 'inventory-asset-values.js'
      - 'test/inventory-asset-values.test.cjs'
      - 'test/inventory-overview-export.test.cjs'
      - 'test/inventory-onhand-local-currency-kpi.test.cjs'
      - 'i18n.js'
      - '.github/workflows/psi-regression-ci.yml'

permissions:
  contents: read

jobs:
  psi-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies without running application postinstall
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check frontend and backend syntax
        run: |
          node --check app.js
          node --check assets/ci-list-freight.js
          node --check scripts/ci-edit-before-pl-hotfix.cjs
          node --check scripts/ci-inline-clearance-hotfix.cjs
          node --check scripts/ci-historical-clearance-hotfix.cjs
          node --check migrations/historical-ci-clearance.js
          node --check test/ci-historical-clearance-hotfix.test.cjs
          node --check test/ci-inline-clearance-hotfix.test.cjs
          node --check test/ci-edit-before-pl-hotfix.test.cjs
          node --check test/ci-clearance-type.test.cjs
          node --check test/ci-edit-entry-supplier-column.test.cjs
          node --check test/ci-logistics-status-filter.test.cjs
          node --check test/supplier-pi-preview-alignment.test.cjs
          node --check app-perf.js
          node --check test/app-perf-diagnostics.test.cjs
          node --check test/app-perf-brand-invalidation.test.cjs
          node --check server.js
          node --check wave2b-pi-batch-import-pg.js
          node --check test/pi-deposit-payable-date.test.cjs
          node --check assets/bigseller-inventory-import.js
          node --check test/bigseller-inventory-import.test.cjs
          node --check assets/zhisu-inventory-import.js
          node --check test/zhisu-inventory-import.test.cjs
          node --check test/inventory-import-precheck.test.cjs
          node --check assets/finance-payment-calendar.js
          node --check test/finance-payment-calendar.test.cjs
          node --check test/manual-payable-item.test.cjs
          node --check po-plan-server.js
          node --check po-plan-ui.js
          node --check scripts/po-plan-bootstrap.cjs
          node --check test/po-plan-quotation-pricing.test.cjs
          node --check po-number.js
          node --check wac-calculator.js
          node --check wac-notification.js
          node --check quotation-server.js
          node --check quotation-import-fast.js
          node --check quotation-import-normalizer.js
          node --check quotation-import-progress.js
          node --check quotation-management.js
          node --check scripts/quotation-management-bootstrap.cjs
          node --check test/quotation-smart-import.test.cjs
          node --check wac-notification-ui.js
          node --check test/wac-cost-change-notification.test.cjs
          node --check test/listing-notification-card.test.cjs
          node --check db-pg.js
          node --check db.js
          node --check db-sqlite.js
          node --check i18n.js
          node --check inventory-asset-values.js
          node --check test/inventory-asset-values.test.cjs
          node --check test/inventory-overview-export.test.cjs
          node --check test/inventory-onhand-local-currency-kpi.test.cjs
          node --check test/wac-history-import.test.cjs
          node --check test/wac-batch-exclusion.test.cjs
      - name: Test supplier PI import preview table alignment
        run: node --test test/supplier-pi-preview-alignment.test.cjs
      - name: Test CI logistics-status filter
        run: node --test test/ci-logistics-status-filter.test.cjs
      - name: Test CI clearance type create, filter, detail and edit
        run: node test/ci-edit-before-pl-hotfix.test.cjs && node test/ci-clearance-type.test.cjs && node test/ci-inline-clearance-hotfix.test.cjs
      - name: Test historical CI clearance setting
        run: node test/ci-historical-clearance-hotfix.test.cjs
      - name: Test unified CI management table
        run: node test/ci-unified-table.test.cjs
      - name: Test CI edit entry and supplier column removal
        run: node test/ci-edit-entry-supplier-column.test.cjs
      - name: Test opt-in page and API performance diagnostics
        run: node --test test/app-perf-diagnostics.test.cjs
      - name: Test brand and inventory filter cache invalidation
        run: node --test test/app-perf-brand-invalidation.test.cjs
      - name: Test finance payment calendar and manual payable creation
        run: node --test test/finance-payment-calendar.test.cjs test/manual-payable-item.test.cjs test/finance-payment-overview-integration.test.cjs test/finance-payment-overview.test.cjs test/finance-payment-overview-sort.test.cjs
      - name: Test PI deposit payable date follows PI date
        run: node --test test/pi-deposit-payable-date.test.cjs
      - name: Test PO number date and country format
        run: node test/po-number-date-country.test.cjs
      - name: Test PO latest FOB quotation and FX pricing
        run: node --test test/po-plan-quotation-pricing.test.cjs
      - name: Test BigSeller inventory import adapter and SKU master-data blocking
        run: node --test test/bigseller-inventory-import.test.cjs test/inventory-import-precheck.test.cjs
      - name: Test Zhisu inventory import adapter and warehouse / duplicate safeguards
        run: node --test test/zhisu-inventory-import.test.cjs
      - name: Test inventory financial value aggregation
        run: node test/inventory-asset-values.test.cjs
      - name: Test inventory overview export fields
        run: node --test test/inventory-overview-export.test.cjs
      - name: Test inventory on-hand local currency KPI
        run: node --test test/inventory-onhand-local-currency-kpi.test.cjs
      - name: Test WAC calculation and transport-basis rules
        run: node --test wac-calculator.test.cjs
      - name: Test WAC cost-change Feishu notification reports
        run: node --test test/wac-cost-change-notification.test.cjs
      - name: Test Listing Feishu notification table cards
        run: node --test test/listing-notification-card.test.cjs
      - name: Test suggested purchase quantity wheel behavior
        run: node test/rp-suggested-qty-wheel.test.cjs
      - name: Test WAC history matrix and historical import
        run: node test/wac-history-import.test.cjs
      - name: Test WAC batch exclusion and restore
        run: node test/wac-batch-exclusion.test.cjs
      - name: Test smart quotation import and supplier SKU mapping
        run: node test/quotation-smart-import.test.cjs
