name: 临时诊断（用完即删）

# 一次性只读诊断：通过 CI 的 SSH 通道查询生产库状态。
# 设备远程通道不可用时的应急手段。只跑 SELECT，不改任何东西。

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare the ssh key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Locate the server
        id: locate
        env:
          FIXED_HOST: ${{ secrets.DEPLOY_HOST }}
          FIXED_USER: ${{ secrets.DEPLOY_USER }}
          FIXED_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -u
          HOSTS="$FIXED_HOST"
          USERS="$FIXED_USER"
          [ -z "$HOSTS" ] && HOSTS="analytics.hitechanalysis.top"
          [ -z "$USERS" ] && USERS="root hitec administrator"
          ssh_opts="-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 -o BatchMode=yes"
          FOUND=""
          for host in $HOSTS; do
            for user in $USERS; do
              if ssh $ssh_opts "${user}@${host}" 'echo OK' >/dev/null 2>&1; then
                FOUND="${user}@${host}"
                break
              fi
            done
            [ -n "$FOUND" ] && break
          done
          if [ -z "$FOUND" ]; then
            echo "::error::找不到生产机"
            exit 1
          fi
          echo "target=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Prepare the ssh config
        env:
          TARGET: ${{ steps.locate.outputs.target }}
        run: |
          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${TARGET#*@}
            User ${TARGET%@*}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
          EOF

      - name: Query the production database
        env:
          DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          DIR="${DIR:-}"
          if [ -z "$DIR" ]; then
            DIR=$(ssh production "find / -maxdepth 4 -type d -name shopee-analytics 2>/dev/null | head -1" | tr -d '\r')
            BASE=$(dirname "$DIR")
          else
            BASE="$DIR"
          fi
          echo "base=$BASE"
          ssh production "cd '$BASE/shopee-analytics/deploy/desktop' && \
            docker compose --env-file runtime/.env exec -T postgres sh -lc \
            'psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"SELECT app_role, shop_id, to_char(expires_at,'\''YYYY-MM-DD HH24:MI'\'') AS expires, to_char(last_refresh_at,'\''YYYY-MM-DD HH24:MI'\'') AS refreshed, to_char(updated_at,'\''YYYY-MM-DD HH24:MI'\'') AS updated FROM shopee_app_tokens ORDER BY app_role, shop_id;\"'" || true
          echo "----- 店铺档案 -----"
          ssh production "cd '$BASE/shopee-analytics/deploy/desktop' && \
            docker compose --env-file runtime/.env exec -T postgres sh -lc \
            'psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"SELECT shop_id, display_name, brand_name, country_code FROM shopee_shop_profiles ORDER BY shop_id;\"'" || true
