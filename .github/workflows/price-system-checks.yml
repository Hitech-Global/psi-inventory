name: Price System Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'price-system-*.js'
      - 'migrations/price-system.js'
      - 'assets/price-system.js'
      - 'test/price-system-*.test.cjs'
      - 'server.js'
      - 'app.js'
      - 'quotation-management.js'
      - 'index.html'
      - 'quotation-category.js'
      - 'sku-category.js'
      - 'quotation-import-fast.js'
      - 'test/sku-category.test.cjs'
      - 'quotation-server.js'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check price-system-formula.js
          node --check quotation-category.js
          node --check sku-category.js
          node --check quotation-import-fast.js
          node --check quotation-server.js
          node --check price-system-api.js
          node --check price-system-quotation-sync.js
          node --check migrations/price-system.js
          node --check assets/price-system.js
          node --check server.js
          node --check app.js
          node --check quotation-management.js
      - name: Price system unit tests
        run: node --test test/price-system-formula.test.cjs test/price-system-category.test.cjs test/sku-category.test.cjs test/price-system-schema.test.cjs test/price-system-sidebar-order.test.cjs test/price-system-landing-cost-srp.test.cjs test/price-system-auto-wac-sync.test.cjs test/price-system-field-order.test.cjs test/price-system-wac-date-display.test.cjs test/price-system-content-fit-columns.test.cjs test/price-system-all-fields-left-aligned.test.cjs test/price-system-formula-builder.test.cjs test/price-system-copy.test.cjs test/price-system-auto-quotation-sync.test.cjs test/price-system-delete.test.cjs test/price-system-field-insert.test.cjs test/price-system-forecast-inventory-columns.test.cjs
