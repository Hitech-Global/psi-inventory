<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PSI 外部用户邀请</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
main{background:white;border:1px solid #e5e5e9;border-radius:20px;box-shadow:0 12px 48px #0000000c;width:100%;max-width:450px;padding:32px}
h1{font-size:22px;margin:0 0 8px}p{font-size:14px;color:#626269;line-height:1.7}.name{font-weight:600;color:#1d1d1f}
label{font-size:13px;display:block;margin:18px 0 7px}input{width:100%;padding:11px 12px;border:1px solid #d6d6dc;border-radius:9px;font-size:15px}
input:focus{outline:none;border-color:#25803b}button{width:100%;margin-top:22px;padding:12px;border:0;background:#2e7d32;border-radius:9px;color:white;font-size:15px;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:default}
#message{margin-top:16px;color:#c33;font-size:13px;line-height:1.7}#success{display:none}a{color:#216a36}
</style>
</head>
<body><main>
<div id="form">
<h1>PSI 外部用户邀请</h1>
<p>这是 PSI 系统管理员发送的专属邀请链接。接受后需等待管理员开通权限。</p>
<p id="recipient">正在验证邀请…</p>
<form id="claim" style="display:none">
<label for="username">设置登录用户名（3–40位英文字母、数字或 . _ -）</label><input id="username" type="text" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,39}" required><div id="invited-email" style="display:none"><label for="email">请确认受邀邮箱</label><input id="email" type="email" autocomplete="email"></div>
<label for="password">设置登录密码（至少12位，包含大小写字母和数字）</label><input id="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
<label for="confirm">再次确认密码</label><input id="confirm" type="password" autocomplete="new-password" required>
<button id="submit" type="submit">接受邀请并创建账号</button>
</form><div id="message" role="alert"></div>
</div>
<div id="success"><h1>已完成注册</h1><p>账号创建成功。请记住刚刚设置的用户名和密码。管理员核实并启用账号后，即可登录系统。</p><a href="/">返回 PSI 登录页，使用“外部用户登录”进入</a></div>
</main>
<script>
'use strict';
let token=decodeURIComponent(location.hash.slice(1));
history.replaceState(null,'','/external-invite.html');
const msg=document.getElementById('message'),form=document.getElementById('claim');
function error(s){msg.textContent=s;}
async function post(url,body){
 const response=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const result=await response.json();
 if(!response.ok)throw Error(result.error||'操作失败');
 return result;
}
(async()=>{
 if(!token){error('邀请链接中缺少凭证。请联系管理员重新发送。');return;}
 try{
  const info=await post('/api/auth/external/invite-info',{token});
  document.getElementById('recipient').textContent='受邀人：'+info.name+(info.email?' · '+info.email:'');
  const emailSection=document.getElementById('invited-email');
  if(info.email){emailSection.style.display='block';document.getElementById('email').required=true;}
  else{emailSection.style.display='none';document.getElementById('email').value='';}
  form.style.display='block';
 }catch(e){error(e.message);}
})();
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 if(password!==confirm){error('两次输入的密码不一致');return;}
 const submit=document.getElementById('submit');submit.disabled=true;error('');
 try{
  await post('/api/auth/external/claim',{token,username:document.getElementById('username').value,email:document.getElementById('email').value,password});
  token=null;document.getElementById('form').style.display='none';document.getElementById('success').style.display='block';
 }catch(err){error(err.message);}
 finally{submit.disabled=false;}
});
</script>
</body></html>
