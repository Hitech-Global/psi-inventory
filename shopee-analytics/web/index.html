<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shopee 运营分析</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">SHOPEE · OPERATIONS ANALYTICS</div>
        <h1>Shopee 运营分析</h1>
        <p class="subtitle">先订单量 → ROAS → 漏斗 → SKU 赛马 → 商品问题 → 下一步验证动作</p>
      </div>
      <div class="health" id="healthBadge">检查数据源…</div>
    </header>

    <section class="filter-card">
      <label>Shop ID<input id="shopId" inputmode="numeric" placeholder="Shopee Shop ID"></label>
      <label>开始日期<input id="startDate" type="date"></label>
      <label>结束日期<input id="endDate" type="date"></label>
      <button id="loadBtn" class="primary">读取分析</button>
    </section>

    <section id="summary" class="kpi-grid hidden"></section>

    <main class="grid">
      <section class="panel campaigns-panel">
        <div class="panel-head">
          <div>
            <h2>广告 Campaign</h2>
            <p>按花费排序；点击查看 7 天/所选周期诊断。</p>
          </div>
          <span id="campaignCount" class="pill">0</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Campaign</th>
                <th>订单</th>
                <th>ROAS</th>
                <th>花费占比</th>
                <th>Target</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="campaignRows">
              <tr><td colspan="6" class="empty">输入 Shop ID 后读取。</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel diagnosis-panel">
        <div class="panel-head">
          <div>
            <h2 id="diagnosisTitle">广告组诊断</h2>
            <p id="diagnosisSubtitle">选择左侧 Campaign。</p>
          </div>
          <span id="diagnosisState" class="pill neutral">等待</span>
        </div>

        <div id="diagnosisBody" class="empty-state">
          <div class="empty-icon">◎</div>
          <strong>还没有选择 Campaign</strong>
          <span>系统会按我们的诊断顺序分析整体和商品层。</span>
        </div>
      </section>
    </main>
  </div>

  <template id="diagnosisTemplate">
    <div class="diagnosis-content">
      <div class="stepbar">
        <span>1 订单量</span><span>2 ROAS</span><span>3 Funnel</span><span>4 SKU 结构</span><span>5 Action</span>
      </div>

      <div class="metric-grid" id="campaignMetrics"></div>

      <div class="compare-card">
        <div>
          <div class="section-label">普通日 BASELINE</div>
          <div id="ordinaryMetrics" class="mini-metrics"></div>
        </div>
        <div class="vs">VS</div>
        <div>
          <div class="section-label">双日 / 25日 EVENT</div>
          <div id="eventMetrics" class="mini-metrics"></div>
        </div>
      </div>

      <div class="section-head">
        <div>
          <h3>SKU 赛马</h3>
          <p>Direct 指标优先判断商品自身；Broad 用于看广告组整体贡献。</p>
        </div>
      </div>
      <div class="table-wrap item-table-wrap">
        <table>
          <thead>
            <tr>
              <th>商品</th>
              <th>状态</th>
              <th>Direct订单</th>
              <th>Direct ROAS</th>
              <th>Broad ROAS</th>
              <th>Spend Share</th>
              <th>Direct GMV Share</th>
              <th>CTR</th>
              <th>Direct CVR</th>
              <th>平台预估ROAS</th>
            </tr>
          </thead>
          <tbody id="itemRows"></tbody>
        </table>
      </div>

      <div class="notes" id="diagnosisNotes"></div>
    </div>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
